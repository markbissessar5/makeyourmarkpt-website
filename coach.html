<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Mark — Coach</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f6f6f4; --panel2:#eeeeec; --raise:#ffffff;
    --ink:#111111; --muted:#6b6b6b; --faint:#9a9a9a;
    --line:#e4e4e1; --line2:#d4d4d0;
    --red:#c8102e; --red-d:#a50d26; --black:#000000;
    --display:'Barlow Condensed',system-ui,sans-serif;
    --body:'Barlow',system-ui,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::selection{background:var(--red);color:#fff}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  h1,h2,h3,.logo{font-family:var(--display)}

  .btn{background:var(--red);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;
    letter-spacing:.02em;text-transform:uppercase;padding:10px 18px;border-radius:8px;transition:.15s}
  .btn:hover{background:var(--red-d)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn.ghost:hover{background:var(--panel2);border-color:var(--ink)}
  .btn.danger{background:transparent;color:var(--red-d);border:1px solid #eccdd2}
  .btn.danger:hover{background:#fbeeef;border-color:var(--red)}
  .btn.sm{font-size:12px;padding:7px 12px}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:400px;text-align:center}
  .loginbox .logo{font-size:36px;font-weight:800;text-transform:uppercase;line-height:.95}
  .loginbox .logo .dot{color:var(--red)}
  .loginbox .tag{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin:10px 0 26px}
  .loginform{display:flex;flex-direction:column;gap:12px}
  .loginform input{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:13px 16px;font-size:16px}
  .loginform input:focus{outline:none;border-color:var(--red)}
  .codebox{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .codebox input{text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.25em}
  .msg{margin-top:16px;font-size:14px;padding:12px 14px;border-radius:8px}
  .msg.ok{background:#f0f7f0;color:#2e6b2e;border:1px solid #cfe6cf}
  .msg.err{background:#fbeeef;color:var(--red-d);border:1px solid #f0d2d6}
  .booting{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:13px}

  header{position:sticky;top:0;z-index:30;background:var(--black);color:#fff}
  .bar{display:flex;align-items:center;gap:16px;padding:11px 0;flex-wrap:wrap}
  .logo.top{font-size:21px;font-weight:800;text-transform:uppercase;color:#fff;margin-right:auto}
  .logo.top .dot{color:var(--red)}
  .logo.top .coach{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.14em;margin-left:10px}
  nav{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
  .tab{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
    color:rgba(255,255,255,.7);padding:7px 16px;border-radius:999px;white-space:nowrap}
  .tab:hover{color:#fff}
  .tab.on{background:var(--red);color:#fff}
  .logout{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .logout:hover{color:#fff}

  main{padding:26px 0 90px}
  .head{margin-bottom:18px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
  h1{font-weight:800;font-size:clamp(26px,4vw,36px);text-transform:uppercase;line-height:1}
  .sub{color:var(--muted);margin-top:6px;max-width:64ch}

  /* library */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 14px}
  .search:focus{outline:none;border-color:var(--red)}
  .toolbar select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--ink)}
  .count{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .exlist{display:flex;flex-direction:column;gap:8px}
  .exrow{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .exrow:hover{border-color:var(--line2)}
  .exthumb{width:64px;height:44px;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none}
  .exmain{flex:1;min-width:0;cursor:pointer}
  .exname{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;line-height:1.05}
  .exmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:capitalize}
  .vbadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;flex:none}
  .vbadge.has{color:#2e6b2e;background:#f0f7f0;border:1px solid #cfe6cf}
  .vbadge.none{color:var(--faint);background:var(--panel2);border:1px solid var(--line)}
  .custombadge{font-family:var(--mono);font-size:9.5px;color:var(--red-d);background:#fdf3f4;border:1px solid #eccdd2;border-radius:999px;padding:3px 9px;flex:none}
  .loadmore{margin:16px auto 0;display:block}
  .bulkvid{flex:none;width:270px;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11.5px}
  .bulkvid:focus{outline:none;border-color:var(--red)}
  .bulkvid.dirty{border-color:var(--red);background:#fdf7f8}
  @media(max-width:720px){.bulkvid{width:100%}.exrow{flex-wrap:wrap}}

  /* clients + builder */
  .layout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .clist{display:flex;flex-direction:column;gap:6px}
  .crow{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
  .crow:hover{border-color:var(--line2)}
  .crow.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
  .crow .cn{font-weight:600}
  .crow .cs{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .crow .num{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .crow.archived .cn{color:var(--faint)}

  .subtabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .subtab{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);padding:9px 4px;margin-right:14px;border-bottom:2px solid transparent}
  .subtab.on{color:var(--ink);border-bottom-color:var(--red)}
  .clientbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .clientbar h2{font-size:27px;font-weight:800;text-transform:uppercase;line-height:1}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--line2);color:var(--muted)}
  .pill.good{color:#2e6b2e;background:#f0f7f0;border-color:#cfe6cf}
  .pill.warn{color:var(--red-d);background:#fdf3f4;border-color:#eccdd2}

  .sesslist{display:flex;flex-direction:column;gap:10px}
  .sess{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .sesshead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sessdate{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--red);text-transform:uppercase;flex:none}
  .sesstitle{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;margin-right:auto;
    background:none;border:none;border-bottom:1px dashed transparent;padding:1px 0;min-width:120px;flex:1}
  .sesstitle:hover,.sesstitle:focus{border-bottom-color:var(--line2);outline:none}
  .sessx{display:flex;gap:6px;flex-wrap:wrap}
  .exline{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .exline:first-of-type{margin-top:10px}
  .exline .en{flex:1;font-weight:600;font-size:14px}
  .exline .rx{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .exline .ord{font-family:var(--mono);font-size:13px;color:var(--faint);padding:0 3px}
  .exline .ord:hover{color:var(--ink)}
  .exline .del{color:var(--faint);font-size:15px}
  .exline .del:hover{color:var(--red)}
  .empty{text-align:center;padding:44px 16px;color:var(--muted);background:var(--panel);border:1px dashed var(--line2);border-radius:12px}
  .savestate{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}

  /* weekly schedule */
  .schedwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:16px}
  .schedwrap h3{font-size:17px;text-transform:uppercase;margin-bottom:3px}
  .schednote{font-size:13px;color:var(--muted);margin-bottom:12px}
  .schedgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  @media(max-width:860px){.schedgrid{grid-template-columns:repeat(2,1fr)}}
  .schedcell label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .schedcell select{width:100%;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:8px 6px;font-size:12.5px}
  .schedcell select:focus{outline:none;border-color:var(--red)}

  /* profile + progress */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h3{font-size:17px;text-transform:uppercase;margin-bottom:10px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
  .kpibox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpibox b{font-family:var(--display);font-size:29px;font-weight:800;line-height:1;display:block}
  .kpibox span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .rowlist{display:flex;flex-direction:column;gap:7px}
  .rowitem{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px}
  .rowitem .rt{flex:1;font-weight:600}
  .rowitem .rm{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .rowitem .del{color:var(--faint);font-size:15px}
  .rowitem .del:hover{color:var(--red)}
  .readonly{font-size:14px;color:var(--muted);white-space:pre-wrap}
  .readonly b{color:var(--ink);font-weight:600}
  .spark{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:8px}
  .spark i{flex:1;max-width:30px;background:var(--red);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
  .spark{justify-content:flex-start}
  .dangerzone{border-color:#eccdd2;background:#fdf7f8}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.overlay{align-items:center}}
  .sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;border-radius:16px 16px 0 0;overflow-y:auto}
  @media(min-width:640px){.sheet{border-radius:16px}}
  .sh{padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative}
  .close{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;color:var(--faint)}
  .close:hover{color:var(--ink)}
  .sh h2{font-size:24px;font-weight:800;text-transform:uppercase;padding-right:30px;line-height:1}
  .sh .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;text-transform:capitalize}
  .sb{padding:18px 24px 24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--red)}
  .field textarea{min-height:84px;resize:vertical}
  .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .vid{margin:12px 0;aspect-ratio:16/9;width:100%;border:none;border-radius:10px;background:var(--panel2)}
  .exphotos{display:flex;gap:10px;margin:12px 0}
  .exphotos img{width:calc(50% - 5px);border-radius:10px;border:1px solid var(--line)}
  .cuebox{font-size:14px;color:var(--muted);background:var(--panel);border-radius:10px;padding:12px 14px;margin:12px 0}
  .sheetacts{display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
  .picker .search{width:100%;margin-bottom:10px}
  .pickrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;margin-bottom:6px}
  .pickrow:hover{border-color:var(--red)}
  .pickrow .pn{font-weight:600;flex:1}
  .pickrow .pm{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:capitalize}
  .rxgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px}

  /* calendar planning */
  .coachcal{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.coachcal{grid-template-columns:1fr}}
  .cweek{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  @media(max-width:900px){.cweek{grid-template-columns:1fr}}
  .cday{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:220px;padding:11px}
  .cday.today{border-color:var(--red)}
  .cdate{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;margin-bottom:8px}
  .cevent{background:var(--raise);border-left:3px solid var(--red);border-radius:7px;padding:7px;margin-bottom:6px;font-size:12px;cursor:pointer}
  .cevent.coach{border-left-color:var(--black);cursor:default}
  .cplan{background:#fdf3f4;border:1px solid #eccdd2;border-radius:8px;padding:8px;margin-bottom:7px;font-size:11px;cursor:pointer}
  .cactions{display:flex;gap:5px;margin-top:7px}
  .cactions button{flex:1;border:1px dashed var(--line2);border-radius:7px;padding:6px;font-family:var(--display);font-size:11px;text-transform:uppercase}

  .groupbadge{font-family:var(--mono);font-size:9px;background:var(--black);color:#fff;border-radius:999px;padding:3px 7px}
  .coachnut{font-family:var(--mono);font-size:9px;color:var(--muted);margin:5px 0}
</style>
</head>
<body>

<div id="boot" class="booting">Signing you in…</div>
<div id="login" hidden></div>

<div id="app" hidden>
  <header><div class="wrap bar">
    <div class="logo top">MAKE YOUR MARK<span class="dot">.</span><span class="coach">COACH</span></div>
    <nav id="nav"></nav>
    <button class="logout" data-act="logout">Log out</button>
  </div></header>
  <main><div class="wrap" id="view"></div></main>
</div>

<div id="modal"></div>

<script>
/* ============ CONFIG ============ */
const API = 'https://script.google.com/macros/s/AKfycbyD8fPljDiT_HGMfxRGbPK7lQTyM82iWnu6s2hmu7CzmGgFfopLZ6DCwOn4Nf5ylKAEkg/exec';
const PAGE = 60;
const WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ============ STATE ============ */
let SESSION = null;
let S = { name:'', clients:[], templates:[], exercises:[], recipes:[] };
let DETAIL = {};           // email -> admin_client_detail payload
let VIDEO_EDITS = {};      // exerciseId -> pending video url (bulk mode)
let UI = {
  view:'clients', ctab:'programme', q:'', muscle:'', equip:'', shown:PAGE, bulk:false,
  client:null, tpl:null, invite:false, weekOffset:0,
  calEvent:null, calDate:null, dayPlanDate:null,
  openEx:null, editEx:false, addEx:false,
  addDay:null, pickFor:null, pickQ:'', rxFor:null,
  newTpl:false, assign:false, addHabit:false, confirmRemove:false,
  saving:''
};
let saveTimer = null;

const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(p){ const r = await fetch(API,{method:'POST',body:JSON.stringify(p)}); return await r.json(); }

/* ============ BOOT / AUTH ============ */
(async function boot(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if(token){
    history.replaceState({}, '', location.pathname);
    try{
      const res = await api({ action:'validate', token });
      if(res.ok && res.admin){
        SESSION = res.session;
        try{ localStorage.setItem('mym_coach_session', SESSION); }catch(e){}
        if(await loadData()){ showApp(); return; }
      } else if(res.ok){
        // Valid login, but not a coach account: hand them to the client portal
        // with the session already stored so they don't burn a second link.
        try{ localStorage.setItem('mym_session', res.session); }catch(e){}
        location.replace('/portal.html');
        return;
      }
    }catch(e){}
    showLogin('That link has expired or already been used. Enter your email for a fresh one.');
    return;
  }
  try{ SESSION = localStorage.getItem('mym_coach_session') || localStorage.getItem('mym_session'); }catch(e){}
  if(SESSION){
    try{ if(await loadData()){ showApp(); return; } }catch(e){}
    try{ localStorage.removeItem('mym_coach_session'); }catch(e){}
    SESSION = null;
  }
  showLogin();
})();

async function loadData(){
  const res = await api({ action:'admin_data', session: SESSION });
  if(!res || !res.ok) return false;
  S.name = res.name||''; S.clients = res.clients||[]; S.templates = res.templates||[];
  S.exercises = res.exercises||[]; S.recipes = res.recipes||[];
  S.clients.forEach(c=>{
    if(!Array.isArray(c.days)) c.days=[];
    if(!c.schedule||typeof c.schedule!=='object') c.schedule={};
    if(!c.targets||typeof c.targets!=='object') c.targets={};
    if(!Array.isArray(c.habits)) c.habits=[];
  });
  S.templates.forEach(t=>{ if(!Array.isArray(t.days)) t.days=[]; });
  return true;
}

async function loadDetail(email){
  if(DETAIL[email]) return DETAIL[email];
  const res = await api({action:'admin_client_detail',session:SESSION,email});
  if(res && res.ok){ DETAIL[email]=res; return res; }
  return null;
}

function showLogin(msg){
  $('boot').hidden = true; $('app').hidden = true;
  const el = $('login'); el.hidden = false;
  el.innerHTML = `<div class="loginbox">
    <div class="logo">MAKE YOUR MARK<span class="dot">.</span></div>
    <div class="tag">Coach Login</div>
    <div class="loginform">
      <input id="emailIn" type="email" placeholder="you@email.com" autocomplete="email">
      <button class="btn" data-act="sendlink">Send my login code</button>
    </div>
    <div class="codebox" id="codeBox" hidden>
      <p style="margin-bottom:10px;color:var(--muted)">Enter the code from your email.</p>
      <div class="loginform">
        <input id="codeIn" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        <button class="btn" data-act="verifycode">Sign in</button>
      </div>
    </div>
    <div id="loginMsg">${msg?`<div class="msg err">${esc(msg)}</div>`:''}</div>
  </div>`;
  const inp = $('emailIn');
  if(inp){ inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') sendLink(); }); }
}
async function sendLink(){
  const email = ($('emailIn')?$('emailIn').value:'').trim();
  const box = $('loginMsg');
  if(!email || email.indexOf('@')<0){ box.innerHTML='<div class="msg err">Enter a valid email.</div>'; return; }
  box.innerHTML = '<div class="msg">Sending…</div>';
  try{ await api({ action:'request', email }); }catch(e){}
  box.innerHTML = '<div class="msg ok">If that email has coach access, a 6-digit code and login link are on their way. The link opens this coach app directly.</div>';
  const cb=$('codeBox'); if(cb) cb.hidden=false;
  const ci=$('codeIn'); if(ci){ ci.focus(); ci.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyCode(); }); }
}
async function verifyCode(){
  const email=($('emailIn')?$('emailIn').value:'').trim();
  const code=($('codeIn')?$('codeIn').value:'').replace(/\D/g,'');
  const box=$('loginMsg');
  if(!email || code.length!==6){ box.innerHTML='<div class="msg err">Enter your email and the 6-digit code.</div>'; return; }
  box.innerHTML='<div class="msg">Signing in…</div>';
  try{
    const res=await api({action:'verify_code',email,code});
    if(res.ok && res.admin){
      SESSION=res.session; try{localStorage.setItem('mym_coach_session',SESSION);}catch(e){}
      if(await loadData()){ showApp(); return; }
    } else if(res.ok){
      box.innerHTML='<div class="msg err">That account doesn\u2019t have coach access.</div>'; return;
    }
  }catch(e){}
  box.innerHTML='<div class="msg err">That code is invalid or has expired. Request a new one.</div>';
}
function showApp(){ $('boot').hidden=true; $('login').hidden=true; $('app').hidden=false; render(); }
function logout(){ try{ localStorage.removeItem('mym_coach_session'); }catch(e){} SESSION=null; showLogin(); }

const exById = id => S.exercises.find(x=>x.id===id);
function client(){ return S.clients.find(c=>c.email===UI.client); }
function tpl(){ return S.templates.find(t=>t.id===UI.tpl); }
function detail(){ return DETAIL[UI.client]||null; }

function ytId(url){ const m=(url||'').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/); return m?m[1]:null; }
function driveId(url){ const m=(url||'').match(/drive\.google\.com\/file\/d\/([\w-]+)/); return m?m[1]:null; }
function embedFor(url){
  const y=ytId(url); if(y) return 'https://www.youtube.com/embed/'+y;
  const d=driveId(url); if(d) return 'https://drive.google.com/file/d/'+d+'/preview';
  return null;
}
function localISO(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);}
function todayISO(){ return localISO(new Date()); }
function newId(p){ return p+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
/* Monday = 0, matching the schedule keys and the portal's week grid. */
function weekdayIndex(iso){ return (new Date(iso+'T12:00:00').getDay()+6)%7; }

function markSaving(){ UI.saving='Saving…'; const el=$('saveState'); if(el)el.textContent=UI.saving; }
function markSaved(){ UI.saving='Saved'; const el=$('saveState'); if(el)el.textContent=UI.saving; }

/* Both editors autosave on the same debounce. ctx 'c' = this client's own
   programme, 't' = the master template. */
function ctxDays(ctx){ const o = ctx==='t'?tpl():client(); return o?o.days:[]; }
function ctxSave(ctx){ ctx==='t'?saveTemplate():saveDays(); }

function saveDays(){
  const c=client(); if(!c) return;
  markSaving(); clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await api({action:'admin_save_days',session:SESSION,email:c.email,days:c.days,schedule:c.schedule}); markSaved(); }
    catch(e){ UI.saving='Save failed — retrying'; const el=$('saveState'); if(el)el.textContent=UI.saving; saveDays(); }
  },700);
}
function saveTemplate(){
  const t=tpl(); if(!t) return;
  markSaving(); clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await api({action:'admin_save_template',session:SESSION,template:{id:t.id,name:t.name,description:t.description,days:t.days}}); markSaved(); }
    catch(e){ UI.saving='Save failed — retrying'; const el=$('saveState'); if(el)el.textContent=UI.saving; saveTemplate(); }
  },700);
}
async function saveClientFields(patch){
  const c=client(); if(!c) return;
  markSaving();
  const res=await api(Object.assign({action:'admin_save_client',session:SESSION,email:c.email},patch));

function rxText(e){
  const bits=[];
  if(e.sets&&e.reps) bits.push(e.sets+'\u00d7'+e.reps); else if(e.sets) bits.push(e.sets+' sets'); else if(e.reps) bits.push(e.reps+' reps');
  if(e.duration) bits.push(e.duration+'s work');
  if(e.rest) bits.push(e.rest+'s rest');
  return bits.join(' \u00b7 ')||'set rx';
}

function paneProgress(c){
  const d=detail();
  if(!d) return '<div class="empty">Loading\u2026</div>';
  const logs=d.workoutLogs||[], checkins=d.checkins||[];
  const since=new Date(); since.setDate(since.getDate()-28);
  const recent=logs.filter(l=>l.completedAt && new Date(l.completedAt)>=since);
  const perWeek=Object.keys(c.schedule||{}).length;
  const expected=perWeek*4;
  const adherence=expected?Math.round(recent.length/expected*100):null;
  const diffs=recent.map(l=>Number(l.difficulty)).filter(n=>n>0);
  const avgDiff=diffs.length?(diffs.reduce((a,b)=>a+b,0)/diffs.length).toFixed(1):'\u2014';
  const last=logs[0];
  const weights=checkins.filter(x=>Number(x.weight)>0).slice(0,12).reverse();
  const wNow=weights.length?Number(weights[weights.length-1].weight):null;
  const wThen=weights.length>1?Number(weights[0].weight):null;
  const wDelta=(wNow!==null&&wThen!==null)?(wNow-wThen):null;
  const vals=weights.map(w=>Number(w.weight));
  const lo=vals.length?Math.min(...vals):0, hi=vals.length?Math.max(...vals):1;
  const pad=Math.max((hi-lo)*0.6,2);
  const min=lo-pad, max=hi+pad;
  const pains=recent.filter(l=>String(l.pain).toLowerCase()==='yes').length;
  return `<div class="kpi">
      <div class="kpibox"><b>${recent.length}</b><span>Sessions, 28 days</span></div>
      <div class="kpibox"><b>${adherence===null?'\u2014':adherence+'%'}</b><span>Adherence${expected?' of '+expected:''}</span></div>
      <div class="kpibox"><b>${avgDiff}</b><span>Avg difficulty</span></div>
      <div class="kpibox"><b>${wNow!==null?wNow:'\u2014'}</b><span>Weight${wDelta!==null?(wDelta>=0?' (+'+wDelta.toFixed(1)+')':' ('+wDelta.toFixed(1)+')'):''}</span></div>
      <div class="kpibox"><b>${pains}</b><span>Sessions with pain</span></div>
    </div>
    ${weights.length>1?`<div class="card" style="margin-bottom:16px"><h3>Weight trend</h3>
      <div class="spark">${weights.map(w=>{const v=Number(w.weight);const h=max===min?50:Math.round((v-min)/(max-min)*90)+5;
        return `<i style="height:${h}%" title="${esc(w.date)} \u00b7 ${v}"></i>`;}).join('')}</div>
      <div class="count" style="margin-top:6px">${esc(weights[0].date)} \u2192 ${esc(weights[weights.length-1].date)}</div></div>`:''}
    <div class="card" style="margin-bottom:16px"><h3>Recent sessions</h3>
      <div class="rowlist">${logs.slice(0,10).map(l=>`<div class="rowitem">
        <span class="rt">${esc(l.title||'Workout')}</span>
        <span class="rm">${esc((l.completedAt||'').slice(0,10))} \u00b7 ${Math.round((l.duration||0)/60)} min${l.difficulty?' \u00b7 RPE '+esc(l.difficulty):''}${String(l.pain).toLowerCase()==='yes'?' \u00b7 pain':''}</span>
        </div>${l.note?`<div class="count" style="padding:0 12px 4px">\u201c${esc(l.note)}\u201d</div>`:''}`).join('')||'<div class="rm" style="color:var(--muted);font-size:13px">No completed sessions yet.</div>'}</div>
    </div>
    <div class="card"><h3>Check-ins</h3>
      <div class="rowlist">${checkins.slice(0,10).map(k=>`<div class="rowitem">
        <span class="rt">${esc(k.date)}</span><span class="rm">${k.weight?esc(k.weight)+' kg':''}${k.note?' \u00b7 '+esc(k.note):''}</span></div>`).join('')

    </div>`;
}

/* ---- calendar ---- */
function cDateLabel(iso,opt){return new Date(iso+'T12:00:00').toLocaleDateString('en-AU',opt||{weekday:'short',day:'numeric',month:'short'});}
function cStartWeek(offset){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+(offset||0)*7);return d;}
function cEventDay(e){return String(e.start||'').slice(0,10);}
function cTime(v,all){if(all)return'All day';const m=String(v||'').match(/T(\d\d):(\d\d)/);if(!m)return'';return new Date('2000-01-01T'+m[1]+':'+m[2]).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});}
function dayForDate(c,date){ const id=(c.schedule||{})[String(weekdayIndex(date))]; return id?c.days.find(d=>d.id===id):null; }
function coachNutritionLine(c,date,p){
  const t=c.targets||{};
  const cal=(p&&p.calories)||t.calories, pro=(p&&p.protein)||t.protein;
  if(!cal&&!pro) return 'No target';
  return (cal?cal+' kcal':'')+(cal&&pro?' \u00b7 ':'')+(pro?pro+'g P':'');
}
function viewCoachCalendar(){
  const rows=S.clients.filter(c=>c.status.toLowerCase()!=='archived').map(c=>
    `<button class="crow ${UI.client===c.email?'on':''}" data-act="pickcalclient" data-e="${esc(c.email)}"><span class="cn">${esc(c.name||c.email)}</span></button>`).join('');
  if(!UI.client)return `<div class="head"><div class="eyebrow">Coach</div><h1>Client calendar</h1><p class="sub">Choose a client to see their sporting commitments and plan around them.</p></div><div class="clist" style="max-width:320px">${rows}</div>`;
  const c=client(), d=detail();
  const start=cStartWeek(UI.weekOffset), dates=[];for(let i=0;i<7;i++){const x=new Date(start);x.setDate(start.getDate()+i);dates.push(localISO(x));}
  const label=cDateLabel(dates[0],{day:'numeric',month:'short'})+' \u2013 '+cDateLabel(dates[6],{day:'numeric',month:'short',year:'numeric'});
  const events=(d&&d.events)||[], plans=(d&&d.dailyPlans)||{};
  return `<div class="head"><div class="eyebrow">Coach</div><h1>${esc(c.name)}\u2019s calendar</h1><p class="sub">Their commitments and the scheduled training day, plus one-off nutrition or recovery overrides.</p></div>
    <div class="coachcal"><div class="clist">${rows}</div><div>
      <div class="toolbar"><button class="btn ghost sm" data-act="cprevweek">\u2190</button><strong>${esc(label)}</strong><button class="btn ghost sm" data-act="cthisweek">Today</button><button class="btn ghost sm" data-act="cnextweek">\u2192</button></div>
      ${d?`<div class="cweek">${dates.map(date=>{
        const ev=events.filter(e=>cEventDay(e)===date), p=plans[date]||{}, day=dayForDate(c,date);
        return `<div class="cday ${date===todayISO()?'today':''}"><div class="cdate">${cDateLabel(date,{weekday:'short',day:'numeric'})}</div>
          ${p.dayType||p.coachNote?`<div class="cplan" data-act="editdayplan" data-date="${date}"><b>${esc(p.dayType||'Daily plan')}</b>${p.coachNote?`<br>${esc(p.coachNote)}`:''}<div class="coachnut">${esc(coachNutritionLine(c,date,p))}</div></div>`:''}
          ${day?`<div class="cevent coach"><b>${esc(day.title||day.label)}</b><br>${esc(day.label)} \u00b7 ${(day.exercises||[]).length} exercise${(day.exercises||[]).length===1?'':'s'}</div>`:''}
          ${ev.map(e=>`<div class="cevent ${e.createdBy==='coach'?'coach':''}" data-act="editcalevent" data-id="${esc(e.id)}"><b>${esc(e.title)}</b><br>${esc(cTime(e.start,e.allDay))} \u00b7 ${esc(e.type)}</div>`).join('')}
          <div class="cactions"><button data-act="addcalevent" data-date="${date}">+ Event</button><button data-act="editdayplan" data-date="${date}">Plan</button></div>
        </div>`;}).join('')}</div>`:'<div class="empty">Loading\u2026</div>'}
    </div></div>`;
}

document.addEventListener('change', e=>{

  const act=t.dataset.act;
  if(act==='fmuscle'){ UI.muscle=t.value; UI.shown=PAGE; render(); }
  if(act==='fequip'){ UI.equip=t.value; UI.shown=PAGE; render(); }

    if(t.value) c.schedule[t.dataset.k]=t.value; else delete c.schedule[t.dataset.k];
    saveDays(); }
});
document.addEventListener('input', e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act;
  if(act==='daytitle'){ const days=ctxDays(t.dataset.ctx); days[+t.dataset.i].title=t.value; ctxSave(t.dataset.ctx); }
  if(act==='vidinput'){
    const id=t.dataset.id, ex=exById(id);
    const val=t.value.trim();
    if(ex && val===(ex.video||'')) delete VIDEO_EDITS[id]; else VIDEO_EDITS[id]=val;
    t.classList.toggle('dirty',VIDEO_EDITS.hasOwnProperty(id));
    const n=Object.keys(VIDEO_EDITS).length;
    const btn=document.querySelector('[data-act="savevideos"]');
    if(btn){ btn.disabled=!n; btn.textContent='Save '+(n||'')+' link'+(n===1?'':'s'); }
    const dbtn=document.querySelector('[data-act="discardvideos"]'); if(dbtn) dbtn.disabled=!n;
    const cnt=document.querySelector('.toolbar .count'); if(cnt&&cnt.textContent.indexOf('unsaved')>=0) cnt.textContent=n+' unsaved';
  }
});
document.addEventListener('click', async e=>{
  if(e.target.classList.contains('overlay')||e.target.classList.contains('close')){ closeModals(); renderModal(); return; }
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act;
  const ctx=t.dataset.ctx;
  const c=client();
  switch(act){
    case 'sendlink': sendLink(); break;
    case 'verifycode': verifyCode(); break;
    case 'logout': logout(); break;
    case 'nav': UI.view=t.dataset.k; render(); window.scrollTo(0,0); break;

    /* clients */
    case 'pickclient': case 'pickcalclient': {
      UI.client=t.dataset.e; UI.saving=''; render();
      const d=await loadDetail(UI.client); if(d) render();
      break; }
    case 'ctab': UI.ctab=t.dataset.k; render(); break;
    case 'inviteclient': UI.invite=true; renderModal(); break;
    case 'confirminvite': {
      const name=$('inv_name').value.trim(), email=$('inv_email').value.trim().toLowerCase(), box=$('inviteMsg');
      if(!name || email.indexOf('@')<1){box.innerHTML='<div class="msg err">Enter the client name and a valid email.</div>';break;}
      t.disabled=true;t.textContent='Sending\u2026';
      const res=await api({action:'admin_invite',session:SESSION,name,email});
      if(res.ok){ const existing=S.clients.find(x=>x.email===email); if(!existing)S.clients.push(res.client); else Object.assign(existing,res.client);
        closeModals(); UI.client=email; UI.ctab='programme'; render(); }
      else {t.disabled=false;t.textContent='Send invitation';box.innerHTML='<div class="msg err">Invitation could not be sent.</div>';}
      break; }
    case 'savetargets': {
      await saveClientFields({targets:{calories:$('t_cal').value,protein:$('t_pro').value,notes:$('t_notes').value}});
      break; }
    case 'savecoachnotes': {
      const notes=$('c_notes').value;
      await saveClientFields({coachNotes:notes});
      if(DETAIL[UI.client]) DETAIL[UI.client].coachNotes=notes;
      break; }
    case 'addhabit': UI.addHabit=true; renderModal(); break;
    case 'confirmhabit': {
      const name=$('h_name').value.trim(); if(!name)break;
      const habits=(c.habits||[]).concat([{name,frequency:$('h_freq').value}]);
      closeModals(); await saveClientFields({habits}); render(); break; }
    case 'delhabit': {
      const habits=(c.habits||[]).filter((_,i)=>i!==+t.dataset.i);
      await saveClientFields({habits}); render(); break; }
    case 'removeclient': UI.confirmRemove=true; renderModal(); break;
    case 'confirmremove': {
      const mode=t.dataset.mode, box=$('removeMsg');
      t.disabled=true; t.textContent='Working\u2026';
      const res=await api({action:'admin_delete_client',session:SESSION,email:c.email,mode});
      if(res.ok){
        if(mode==='delete'){ S.clients=S.clients.filter(x=>x.email!==c.email); UI.client=null; }
        else { c.status='Archived'; }
        delete DETAIL[c.email]; closeModals(); render();
      } else {
        t.disabled=false; t.textContent=mode==='delete'?'Delete permanently':'Archive client';
        box.innerHTML='<div class="msg err">'+(res.error==='cannot_remove_coach'?'Coach accounts can\u2019t be removed here.':'That didn\u2019t work. Try again.')+'</div>';
      }
      break; }

    /* templates */
    case 'newtpl': UI.newTpl=true; renderModal(); break;
    case 'edittplmeta': UI.newTpl='edit'; renderModal(); break;
    case 'picktpl': UI.tpl=t.dataset.id; UI.saving=''; render(); break;
    case 'confirmtpl': {
      const name=$('tpl_name').value.trim(); if(!name)break;
      const desc=$('tpl_desc').value.trim(); const id=t.dataset.id||'';
      t.disabled=true; t.textContent='Saving\u2026';
      const existing=id?tpl():null;
      const res=await api({action:'admin_save_template',session:SESSION,template:{id,name,description:desc,days:existing?existing.days:[]}});
      if(res.ok){
        const i=S.templates.findIndex(x=>x.id===res.template.id);
        if(i>=0) S.templates[i]=res.template; else S.templates.push(res.template);
        UI.tpl=res.template.id; closeModals(); render();
      } else { t.disabled=false; t.textContent='Save'; }
      break; }
    case 'deltpl': {
      const tt=tpl(); if(!tt)break;
      const res=await api({action:'admin_delete_template',session:SESSION,id:tt.id});
      if(res.ok){ S.templates=S.templates.filter(x=>x.id!==tt.id); UI.tpl=null; render(); }
      break; }
    case 'savetplfrom': {
      // Promote a client's current programme back into the master library.
      const name=prompt('Name this template',(c.templateName||c.name+' programme'));
      if(!name)break;
      const res=await api({action:'admin_save_template',session:SESSION,template:{name,description:'Saved from '+(c.name||c.email),days:c.days}});
      if(res.ok){ S.templates.push(res.template); UI.view='templates'; UI.tpl=res.template.id; render(); }
      break; }
    case 'assignmodal': UI.assign='client'; renderModal(); break;
    case 'assignfromtpl': UI.assign='tpl'; renderModal(); break;
    case 'confirmassign': {
      const fromTpl=t.dataset.from==='tpl';
      const email=fromTpl?$('as_client').value:c.email;
      const templateId=fromTpl?tpl().id:$('as_tpl').value;
      if(!email||!templateId){$('assignMsg').innerHTML='<div class="msg err">Pick both a template and a client.</div>';break;}
      t.disabled=true;t.textContent='Assigning\u2026';
      const res=await api({action:'admin_assign_template',session:SESSION,email,templateId});
      if(res.ok){
        const target=S.clients.find(x=>x.email===email);
        if(target){ target.days=res.programme.days; target.schedule=res.programme.schedule;
          target.templateId=res.programme.templateId; target.templateName=res.programme.templateName; }
        closeModals(); UI.view='clients'; UI.client=email; UI.ctab='programme'; render();
      } else { t.disabled=false;t.textContent='Assign';$('assignMsg').innerHTML='<div class="msg err">That didn\u2019t work.</div>'; }
      break; }

    /* day editor (shared) */
    case 'addday': UI.addDay=ctx; renderModal(); break;
    case 'confirmday': {
      const days=ctxDays(ctx);
      days.push({id:newId('day'),label:'Day '+(days.length+1),title:$('d_title').value.trim()||('Day '+(days.length+1)),exercises:[]});
      relabelDays(days); closeModals(); ctxSave(ctx); render(); break; }
    case 'dupday': {
      const days=ctxDays(ctx); const copy=JSON.parse(JSON.stringify(days[+t.dataset.i]));
      copy.id=newId('day'); days.splice(+t.dataset.i+1,0,copy); relabelDays(days); ctxSave(ctx); render(); break; }
    case 'delday': {
      const days=ctxDays(ctx); const removed=days.splice(+t.dataset.i,1)[0]; relabelDays(days);
      if(ctx!=='t'&&c){ Object.keys(c.schedule).forEach(k=>{ if(c.schedule[k]===removed.id) delete c.schedule[k]; }); }
      ctxSave(ctx); render(); break; }
    case 'dayup': case 'daydown': {
      const days=ctxDays(ctx); const i=+t.dataset.i; const j=act==='dayup'?i-1:i+1;
      if(j<0||j>=days.length)break;
      const [d]=days.splice(i,1); days.splice(j,0,d); relabelDays(days); ctxSave(ctx); render(); break; }
    case 'addexto': UI.pickFor={ctx,i:+t.dataset.i}; UI.pickQ=''; renderModal(); break;
    case 'confirmpick': {
      const {ctx:pctx,i}=UI.pickFor;
      ctxDays(pctx)[i].exercises.push({exerciseId:t.dataset.id,sets:3,rounds:3,reps:'10',duration:0,rest:60,note:'',groupId:'',groupType:'straight',restAfterRound:60});
      UI.pickFor=null; UI.pickQ=''; ctxSave(pctx); render(); break; }
    case 'delex': ctxDays(ctx)[+t.dataset.i].exercises.splice(+t.dataset.j,1); ctxSave(ctx); render(); break;
    case 'exup': case 'exdown': {
      const list=ctxDays(ctx)[+t.dataset.i].exercises; const j=+t.dataset.j; const k=act==='exup'?j-1:j+1;
      if(k<0||k>=list.length)break;
      const [x]=list.splice(j,1); list.splice(k,0,x); ctxSave(ctx); render(); break; }
    case 'editrx': UI.rxFor={ctx,i:+t.dataset.i,j:+t.dataset.j}; renderModal(); break;
    case 'confirmrx': {
      const {ctx:rctx,i,j}=UI.rxFor; const ex=ctxDays(rctx)[i].exercises[j];
      ex.sets=+$('rx_sets').value||1; ex.rounds=ex.sets; ex.reps=$('rx_reps').value.trim();
      ex.duration=+$('rx_duration').value||0; ex.rest=+$('rx_rest').value||0;
      ex.restAfterRound=+$('rx_roundrest').value||0; ex.groupType=$('rx_gtype').value;
      ex.groupId=$('rx_gid').value.trim(); ex.note=$('rx_note').value.trim();
      UI.rxFor=null; ctxSave(rctx); render(); break; }

    /* library */
    case 'more': UI.shown+=PAGE; $('exList').innerHTML=exRows(); break;
    case 'togglebulk': UI.bulk=!UI.bulk; if(!UI.bulk)VIDEO_EDITS={}; render(); break;
    case 'discardvideos': VIDEO_EDITS={}; render(); break;
    case 'savevideos': {
      const items=Object.keys(VIDEO_EDITS).map(id=>({id,video:VIDEO_EDITS[id]}));
      if(!items.length)break;
      t.disabled=true;t.textContent='Saving\u2026';
      const res=await api({action:'admin_bulk_video',session:SESSION,items});
      if(res.ok){ items.forEach(it=>{const x=exById(it.id); if(x)x.video=it.video;}); VIDEO_EDITS={}; render(); }
      else { t.disabled=false;t.textContent='Save links'; }
      break; }
    case 'openex': UI.openEx=t.dataset.id; UI.editEx=false; renderModal(); break;
    case 'editex': UI.editEx=true; renderModal(); break;
    case 'addex': UI.addEx=true; renderModal(); break;
    case 'saveaddex': {
      const ex=readExForm(); if(!ex.name)return;
      t.disabled=true; t.textContent='Adding\u2026';
      const res=await api({action:'admin_addexercise',session:SESSION,exercise:ex});
      if(res.ok){ S.exercises.push(res.exercise); closeModals(); render(); }
      else { t.disabled=false; t.textContent='Add to library'; }
      break; }
    case 'saveeditex': {
      const ex=readExForm(); ex.id=t.dataset.id;
      t.disabled=true; t.textContent='Saving\u2026';
      const res=await api({action:'admin_updateexercise',session:SESSION,exercise:ex});
      if(res.ok){ const i=S.exercises.findIndex(x=>x.id===ex.id); if(i>=0)S.exercises[i]=res.exercise;
        closeModals(); render(); }
      else { t.disabled=false; t.textContent='Save changes'; }
      break; }

    /* calendar */
    case 'cprevweek': UI.weekOffset--; render(); break;
    case 'cnextweek': UI.weekOffset++; render(); break;
    case 'cthisweek': UI.weekOffset=0; render(); break;
    case 'addcalevent': UI.calDate=t.dataset.date;UI.calEvent=null;renderModal();break;
    case 'editcalevent': UI.calEvent=((detail()||{}).events||[]).find(x=>x.id===t.dataset.id)||null;UI.calDate=null;renderModal();break;
    case 'savecalevent': {
      const ev={id:t.dataset.id||'',title:$('ce_title').value.trim(),type:$('ce_type').value,start:$('ce_start').value,end:$('ce_end').value,intensity:$('ce_intensity').value,location:$('ce_location').value.trim(),notes:$('ce_notes').value.trim()};
      if(!ev.title||!ev.start)break;t.disabled=true;t.textContent='Saving\u2026';
      const res=await api({action:'admin_save_event',session:SESSION,email:c.email,event:ev});
      if(res.ok){ const d=detail(); if(d){ d.events=d.events||[]; const i=d.events.findIndex(x=>x.id===res.event.id);
        if(i>=0)d.events[i]=res.event; else d.events.push(res.event); }
        closeModals(); render(); }
      break; }
    case 'deletecalevent': {
      const res=await api({action:'admin_delete_event',session:SESSION,email:c.email,id:t.dataset.id});
      if(res.ok){ const d=detail(); if(d)d.events=(d.events||[]).filter(x=>x.id!==t.dataset.id); closeModals(); render(); }
      break; }
    case 'editdayplan': UI.dayPlanDate=t.dataset.date;renderModal();break;
    case 'savedayplan': {
      const plan={date:UI.dayPlanDate,dayType:$('dp_type').value.trim(),calories:$('dp_cal').value,protein:$('dp_pro').value,
        hydration:$('dp_hyd').value.trim(),recovery:$('dp_rec').value.trim(),coachNote:$('dp_note').value.trim()};
      t.disabled=true;t.textContent='Saving\u2026';
      const res=await api({action:'admin_save_dayplan',session:SESSION,email:c.email,plan});
      if(res.ok){ const d=detail(); if(d){ d.dailyPlans=d.dailyPlans||{}; d.dailyPlans[plan.date]=res.plan; } closeModals(); render(); }
      break; }
  }
});
function readExForm(){
  return {
    name: $('f_name').value.trim(),
    video: $('f_video').value.trim(),
    muscles: $('f_muscles').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),
    equipment: $('f_equip').value.trim().toLowerCase(),
    level: $('f_level').value,
    category: $('f_cat').value.trim().toLowerCase(),
    cues: $('f_cues').value.trim()
  };
}
</script>
</body>
</html>
